services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mercury
      POSTGRES_USER: mercury
      # Bắt buộc khai trong .env — thiếu là compose dừng ngay, không âm thầm dùng
      # một mật khẩu in sẵn trong repo công khai.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Đặt POSTGRES_PASSWORD trong .env rồi chạy lại}"
    volumes:
      - mercury-db:/var/lib/postgresql/data
    # Web chỉ khởi động sau khi database SẴN SÀNG NHẬN LỆNH, không chỉ sau khi
    # container chạy — nếu không, lệnh migrate ở entrypoint sẽ lỗi kết nối.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mercury -d mercury"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    # Chỉ nghe trên máy chủ (127.0.0.1): muốn ra Internet thì đặt reverse proxy
    # có HTTPS phía trước (xem deploy/), không mở cổng 3000 thẳng ra mọi mạng.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Chỉ còn file người dùng tải lên và khóa session — dữ liệu nghiệp vụ
      # đã nằm trong PostgreSQL.
      - mercury-data:/data
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://mercury:${POSTGRES_PASSWORD:?Đặt POSTGRES_PASSWORD trong .env}@db:5432/mercury?schema=public"
      SEED_PASSWORD: "${SEED_PASSWORD:?Đặt SEED_PASSWORD trong .env}"
      # SESSION_SECRET tự sinh và lưu trong volume nếu không đặt ở đây.
      # Truy cập qua HTTP thuần (không HTTPS): bỏ comment dòng dưới để cookie hoạt động.
      # COOKIE_SECURE: "false"

volumes:
  mercury-data:
  mercury-db:
